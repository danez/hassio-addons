name: Builder

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed apps
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/build_matrix.py --base "$BASE_SHA" --event "$GITHUB_EVENT_NAME")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "changed=$(jq 'length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.init.outputs.matrix) }}
    concurrency:
      group: build-${{ matrix.app }}-${{ matrix.publish && 'publish' || github.ref }}
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ matrix.publish }}
    secrets: inherit

  check:
    name: Build checks
    if: always()
    needs: [init, build-app]
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        env:
          INIT_RESULT: ${{ needs.init.result }}
          BUILD_RESULT: ${{ needs.build-app.result }}
        run: |
          test "$INIT_RESULT" = success
          test "$BUILD_RESULT" = success || test "$BUILD_RESULT" = skipped
