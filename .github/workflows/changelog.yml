name: "Renovate — update addon changelogs"

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update-changelogs:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Update addon versions and changelogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/renovate-pr.json"
          python3 .github/scripts/release.py --pr-file "$RUNNER_TEMP/renovate-pr.json"
          git add -- '*/config.yaml' '*/CHANGELOG.md'
          if git diff --cached --quiet; then
            echo "No release metadata changes needed."
            exit 0
          fi
          git config user.name "danez-bot"
          git config user.email "120286224+danez-bot@users.noreply.github.com"
          git commit -m "chore(changelog): bump addon versions"
          git push origin "HEAD:$PR_BRANCH"
